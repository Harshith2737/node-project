openapi: 3.1.0
info:
  title: Telangana Heritage API
  version: 1.0.0
  description: Same-origin destination, trip and community heritage API.
servers:
  - url: /
components:
  securitySchemes:
    ClerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    StoryInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        body: { type: string, minLength: 20, maxLength: 8000 }
        language: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
    ReportInput:
      type: object
      required: [destinationSlug, issueType, description]
      properties:
        destinationSlug: { type: string, minLength: 3, maxLength: 100 }
        issueType:
          type: string
          enum: [litter, vandalism, damage, accessibility, safety, other]
        description: { type: string, minLength: 10, maxLength: 2000 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    TripInput:
      type: object
      required: [destination, durationDays, interest, itinerary]
      properties:
        title: { type: string, maxLength: 100 }
        destination: { type: string, minLength: 2, maxLength: 80 }
        durationDays: { type: integer, minimum: 1, maximum: 7 }
        interest: { type: string, minLength: 2, maxLength: 80 }
        itinerary:
          type: array
          minItems: 1
          maxItems: 21
          items:
            type: object
            required: [title, details]
            properties:
              day: { type: string, maxLength: 20 }
              title: { type: string, minLength: 2, maxLength: 160 }
              details: { type: string, minLength: 2, maxLength: 500 }
    ContributorRequestInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 20, maxLength: 1000 }
    ModerationInput:
      type: object
      required: [status]
      properties:
        status: { type: string }
        priority: { type: string, enum: [normal, high] }
        notes: { type: string, maxLength: 500 }
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200': { description: API is healthy }
  /api/v1/config:
    get:
      summary: Public Clerk browser configuration
      responses:
        '200': { description: Publishable key and auth-enabled flag only }
  /api/v1/destinations:
    get:
      summary: Search/filter destination catalogue
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 80 }
        - in: query
          name: category
          schema: { type: string, enum: [all, Heritage, Nature, Culture] }
      responses:
        '200': { description: Destination results }
        '400': { description: Invalid search filter }
  /api/v1/destinations/{slug}:
    get:
      summary: Destination details
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: Destination record }
        '404': { description: Destination not found }
  /api/v1/stories:
    get:
      summary: List public, published stories
      responses:
        '200': { description: Published stories only }
    post:
      summary: Submit a story for moderation
      security: [{ ClerkBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoryInput' }
      responses:
        '201': { description: Pending story created }
        '401': { description: Sign-in required }
        '403': { description: Contributor/admin role required }
  /api/v1/me:
    get:
      summary: Current profile and stored role
      security: [{ ClerkBearer: [] }]
      responses:
        '200': { description: Authenticated user profile }
        '401': { description: Sign-in required }
  /api/v1/submissions:
    get:
      summary: Current user's own submissions
      security: [{ ClerkBearer: [] }]
      responses:
        '200': { description: Own stories, reports, trips and contributor requests }
  /api/v1/trips:
    get:
      summary: List current user's saved trips
      security: [{ ClerkBearer: [] }]
      responses:
        '200': { description: User-owned itineraries }
    post:
      summary: Save itinerary
      security: [{ ClerkBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '201': { description: Trip saved }
        '400': { description: Invalid itinerary }
  /api/v1/reports:
    post:
      summary: Submit heritage issue report
      security: [{ ClerkBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201': { description: Report accepted with reference ID }
        '400': { description: Invalid report or destination }
        '401': { description: Sign-in required }
        '429': { description: Submission rate limit reached }
  /api/v1/contributor-requests:
    post:
      summary: Request contributor access
      security: [{ ClerkBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContributorRequestInput' }
      responses:
        '201': { description: Request pending review }
        '409': { description: Request already pending or account not eligible }
  /api/v1/admin/queue:
    get:
      summary: List pending moderation queues
      security: [{ ClerkBearer: [] }]
      responses:
        '200': { description: Moderator/admin review queue }
        '403': { description: Insufficient role }
  /api/v1/admin/stories/{id}:
    patch:
      summary: Publish or reject story
      security: [{ ClerkBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationInput' }
      responses:
        '200': { description: Review decision recorded }
        '403': { description: Moderator/admin role required }
  /api/v1/admin/reports/{id}:
    patch:
      summary: Triage, resolve or reject report
      security: [{ ClerkBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationInput' }
      responses:
        '200': { description: Review decision recorded }
        '403': { description: Moderator/admin role required }
  /api/v1/admin/contributor-requests/{id}:
    patch:
      summary: Approve or reject contributor request
      security: [{ ClerkBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationInput' }
      responses:
        '200': { description: Contributor request reviewed }
        '403': { description: Moderator/admin role required }
  /api/v1/admin/users/{userId}:
    patch:
      summary: Change user role within caller's allowed authority
      security: [{ ClerkBearer: [] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [tourist, contributor, moderator, admin] }
      responses:
        '200': { description: Role updated }
        '403': { description: Insufficient authority }
