name: Quality checks

on:
  push:
    branches: [main, codex/production-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pinned runtime dependencies
        working-directory: telangana_heritage_project
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        working-directory: telangana_heritage_project
        run: npm run check
      - name: Run API and security tests
        working-directory: telangana_heritage_project
        run: npm test
      - name: Audit dependencies
        working-directory: telangana_heritage_project
        run: npm audit
      - name: Check patch formatting
        run: git diff --check
