name: Quality checks

on:
  push:
    branches:
      - main
      - codex/production-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate source syntax and required assets
        run: |
          set -euo pipefail
          test -s telangana_heritage_project/frontend/index.html
          test -s telangana_heritage_project/frontend/style.css
          test -s telangana_heritage_project/frontend/app.js
          node --check telangana_heritage_project/frontend/app.js
          node --check telangana_heritage_project/backend/server.js
          git diff --check
